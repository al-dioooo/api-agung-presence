openapi: 3.1.0
info:
  title: Agung Presence API
  version: 1.0.0
  description: API contract for the Agung Presence Laravel backend.
servers:
  - url: "{{base_url}}"
tags:
  - name: Status
  - name: Auth
  - name: Offices
  - name: Attendances
  - name: Attendance Requests
paths:
  /api/status:
    get:
      tags:
        - Status
      summary: Status
      operationId: status
      security: []
      responses:
        "200":
          description: API status response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      operationId: login
      security: []
      x-postman-event:
        - listen: test
          script:
            type: text/javascript
            exec:
              - "const response = pm.response.json();"
              - "if (response?.data?.token) {"
              - "  pm.environment.set('token', response.data.token);"
              - "}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              username:
                value:
                  login: admin@example.com
                  password: password
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Profile
      operationId: profile
      responses:
        "200":
          description: User profile retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags:
        - Auth
      summary: Update Profile
      description: Updates the authenticated user's username, email, and/or password.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            examples:
              profile:
                value:
                  username: budi_santoso
                  email: budi@example.com
                  password: new-password
      responses:
        "200":
          description: User profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      operationId: logout
      responses:
        "200":
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register
      description: Administrator-only endpoint.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
            examples:
              employee:
                value:
                  name: New Employee
                  username: newemployee
                  email: new@example.com
                  password: secure-password
                  role: employee
      responses:
        "201":
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterUserSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/offices:
    get:
      tags:
        - Offices
      summary: List Offices
      description: Employees receive only active offices. Administrators receive all offices unless `active_only=true` is passed.
      operationId: listOffices
      parameters:
        - name: active_only
          in: query
          required: false
          description: Return only active offices when true.
          schema:
            type: boolean
      responses:
        "200":
          description: Offices retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeCollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags:
        - Offices
      summary: Create Office
      description: Administrator-only endpoint.
      operationId: createOffice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOfficeRequest"
            examples:
              office:
                value:
                  name: Kantor Baru
                  address: Jl. Merdeka No. 1
                  latitude: -2.965107
                  longitude: 104.736443
                  radius: 50
                  is_active: true
      responses:
        "201":
          description: Office created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/offices/{office}:
    parameters:
      - $ref: "#/components/parameters/OfficeId"
    get:
      tags:
        - Offices
      summary: Get Office
      operationId: getOffice
      responses:
        "200":
          description: Office retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Offices
      summary: Update Office
      description: Administrator-only endpoint. Partial updates are accepted by the current Laravel request rules.
      operationId: updateOffice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfficeRequest"
      responses:
        "200":
          description: Office updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags:
        - Offices
      summary: Patch Office
      description: Administrator-only endpoint.
      operationId: patchOffice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfficeRequest"
      responses:
        "200":
          description: Office updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Offices
      summary: Delete Office
      description: Administrator-only endpoint. The model uses soft deletes.
      operationId: deleteOffice
      responses:
        "200":
          description: Office deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/attendance-requests:
    get:
      tags:
        - Attendance Requests
      summary: List Requests
      description: Administrators receive all attendance requests. Employees receive only their own requests.
      operationId: listAttendanceRequests
      parameters:
        - name: approval_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AttendanceRequestStatus"
      responses:
        "200":
          description: Attendance requests retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRequestCollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags:
        - Attendance Requests
      summary: Create Request
      description: Employee-only endpoint for Sakit, Cuti, and Izin requests.
      operationId: createAttendanceRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreAttendanceApplicationRequest"
            examples:
              permit:
                value:
                  type: permit
                  start_date: "2026-06-01"
                  end_date: "2026-06-03"
                  description: Mengurus dokumen keluarga.
                  proof_photo: data:image/png;base64,abc
      responses:
        "201":
          description: Attendance request created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/attendance-requests/{attendanceRequest}:
    parameters:
      - $ref: "#/components/parameters/AttendanceRequestId"
    get:
      tags:
        - Attendance Requests
      summary: Get Request
      description: Administrators can view any request. Employees can view only their own request.
      operationId: getAttendanceRequest
      responses:
        "200":
          description: Attendance request retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/attendance-requests/{attendanceRequest}/review:
    parameters:
      - $ref: "#/components/parameters/AttendanceRequestId"
    patch:
      tags:
        - Attendance Requests
      summary: Review Request
      description: Administrator-only endpoint. Approval creates attendance rows for the request date range; rejection requires a reason.
      operationId: reviewAttendanceRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAttendanceRequest"
            examples:
              approve:
                value:
                  approval_status: approved
              reject:
                value:
                  approval_status: rejected
                  rejection_reason: Bukti tidak sesuai.
      responses:
        "200":
          description: Attendance request reviewed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/attendances:
    get:
      tags:
        - Attendances
      summary: List Attendances
      description: Administrators receive all matching attendances. Employees receive only their own matching attendances.
      operationId: listAttendances
      parameters:
        - $ref: "#/components/parameters/AttendanceSearch"
        - $ref: "#/components/parameters/AttendanceUserIdQuery"
        - $ref: "#/components/parameters/AttendanceStatusQuery"
        - $ref: "#/components/parameters/AttendanceOfficeIdQuery"
        - $ref: "#/components/parameters/AttendanceDate"
        - $ref: "#/components/parameters/AttendanceStartDate"
        - $ref: "#/components/parameters/AttendanceEndDate"
      responses:
        "200":
          description: Attendances retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags:
        - Attendances
      summary: Create Attendance
      description: Employees check in for themselves. Administrators must provide `user_id` and can create attendance for another user. The selected office must be active and submitted coordinates must be inside the office radius.
      operationId: createAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreAttendanceRequest"
            examples:
              employeeCheckIn:
                value:
                  office_id: 1
                  in_latitude: -2.965107
                  in_longitude: 104.736443
      responses:
        "201":
          description: Attendance created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/attendances/summary:
    get:
      tags:
        - Attendances
      summary: Attendance Summary
      description: Administrator-only per-employee totals for matching attendance rows. `total_real_check_ins` counts only `on_time` and `late`.
      operationId: attendanceSummary
      parameters:
        - $ref: "#/components/parameters/AttendanceSearch"
        - $ref: "#/components/parameters/AttendanceUserIdQuery"
        - $ref: "#/components/parameters/AttendanceStatusQuery"
        - $ref: "#/components/parameters/AttendanceOfficeIdQuery"
        - $ref: "#/components/parameters/AttendanceDate"
        - $ref: "#/components/parameters/AttendanceStartDate"
        - $ref: "#/components/parameters/AttendanceEndDate"
      responses:
        "200":
          description: Attendance summary retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/attendances/export:
    get:
      tags:
        - Attendances
      summary: Export Attendances
      description: Administrator-only XLSX recap export for matching attendance rows. The workbook includes detail and summary sheets, Excel filters, and embedded proof-photo thumbnails when valid proof photos are available.
      operationId: exportAttendances
      parameters:
        - $ref: "#/components/parameters/AttendanceSearch"
        - $ref: "#/components/parameters/AttendanceUserIdQuery"
        - $ref: "#/components/parameters/AttendanceStatusQuery"
        - $ref: "#/components/parameters/AttendanceOfficeIdQuery"
        - $ref: "#/components/parameters/AttendanceDate"
        - $ref: "#/components/parameters/AttendanceStartDate"
        - $ref: "#/components/parameters/AttendanceEndDate"
      responses:
        "200":
          description: XLSX workbook with attendance detail and totals.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/attendances/manual:
    post:
      tags:
        - Attendances
      summary: Manual Attendance
      description: Administrator-only endpoint for direct manual Sakit, Cuti, or Izin attendance records.
      operationId: manualAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreManualAttendanceRequest"
            examples:
              permit:
                value:
                  user_id: 1
                  date: "2026-06-01"
                  status: permit
      responses:
        "200":
          description: Manual attendance updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "201":
          description: Manual attendance created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/attendances/{attendance}:
    parameters:
      - $ref: "#/components/parameters/AttendanceId"
    get:
      tags:
        - Attendances
      summary: Get Attendance
      description: Administrators can view any attendance. Employees can view only their own attendance.
      operationId: getAttendance
      responses:
        "200":
          description: Attendance retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Attendances
      summary: Update Attendance
      description: Administrators can update any attendance. Employees can update only their own attendance.
      operationId: updateAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendanceRequest"
      responses:
        "200":
          description: Attendance updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags:
        - Attendances
      summary: Patch Attendance
      description: Administrators can update any attendance. Employees can update only their own attendance.
      operationId: patchAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendanceRequest"
      responses:
        "200":
          description: Attendance updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Attendances
      summary: Delete Attendance
      description: Administrator-only endpoint. The model uses soft deletes.
      operationId: deleteAttendance
      responses:
        "200":
          description: Attendance deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/attendances/{attendance}/checkout:
    parameters:
      - $ref: "#/components/parameters/AttendanceId"
    post:
      tags:
        - Attendances
      summary: Checkout Attendance
      description: Sets `out_at` for an active attendance. Employees can check out only their own attendance; administrators can check out any attendance.
      operationId: checkoutAttendance
      responses:
        "200":
          description: Attendance checked out successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: Use the Postman environment variable `{{token}}` as the bearer token value.
  parameters:
    OfficeId:
      name: office
      in: path
      required: true
      description: Office ID.
      schema:
        type: integer
        format: int64
    AttendanceId:
      name: attendance
      in: path
      required: true
      description: Attendance ID.
      schema:
        type: integer
        format: int64
    AttendanceRequestId:
      name: attendanceRequest
      in: path
      required: true
      description: Attendance request ID.
      schema:
        type: integer
        format: int64
    AttendanceSearch:
      name: search
      in: query
      required: false
      description: Search date, raw status, status label, office name/address, employee name, username, or email.
      schema:
        type: string
        maxLength: 255
      example: terlambat
    AttendanceUserIdQuery:
      name: user_id
      in: query
      required: false
      description: Employee ID filter. Administrators can filter any employee; employee users remain scoped to themselves.
      schema:
        type: integer
        format: int64
      example: 1
    AttendanceStatusQuery:
      name: status
      in: query
      required: false
      description: Attendance status filter.
      schema:
        $ref: "#/components/schemas/AttendanceStatus"
    AttendanceOfficeIdQuery:
      name: office_id
      in: query
      required: false
      description: Office ID filter.
      schema:
        type: integer
        format: int64
      example: 1
    AttendanceDate:
      name: date
      in: query
      required: false
      description: Exact attendance date filter in `YYYY-MM-DD` format.
      schema:
        type: string
        format: date
      example: "2026-06-10"
    AttendanceStartDate:
      name: start_date
      in: query
      required: false
      description: Inclusive start date filter in `YYYY-MM-DD` format.
      schema:
        type: string
        format: date
      example: "2026-06-01"
    AttendanceEndDate:
      name: end_date
      in: query
      required: false
      description: Inclusive end date filter in `YYYY-MM-DD` format. Must be after or equal to `start_date` when both are provided.
      schema:
        type: string
        format: date
      example: "2026-06-30"
  responses:
    Unauthenticated:
      description: Unauthenticated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
  schemas:
    StatusResponse:
      type: object
      required:
        - status
        - name
      properties:
        status:
          type: string
          example: ok
        name:
          type: string
          example: Agung Presence

    EmptySuccessResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        data:
          nullable: true

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Username or email address.
        password:
          type: string
          format: password

    RegisterUserRequest:
      type: object
      required:
        - name
        - username
        - email
        - password
        - role
      properties:
        name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
        role:
          $ref: "#/components/schemas/UserRole"

    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]+$"
          description: Letters, numbers, dash, and underscore only.
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password

    StoreOfficeRequest:
      type: object
      required:
        - name
        - latitude
        - longitude
        - work_start_time
        - work_end_time
      properties:
        name:
          type: string
          maxLength: 100
        address:
          type:
            - string
            - "null"
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radius:
          type: integer
          minimum: 1
        work_start_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "08:00"
        work_end_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "17:00"
        photo:
          type:
            - string
            - "null"
        is_active:
          type: boolean

    UpdateOfficeRequest:
