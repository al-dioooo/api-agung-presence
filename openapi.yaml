openapi: 3.1.0
info:
  title: Agung Presence API
  version: 1.0.0
  description: API contract for the Agung Presence Laravel backend.
servers:
  - url: "{{base_url}}"
tags:
  - name: Status
  - name: Auth
  - name: Offices
  - name: Attendances
paths:
  /api/status:
    get:
      tags:
        - Status
      summary: Get API status
      operationId: getApiStatus
      security: []
      responses:
        "200":
          description: API status response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in with username or email
      operationId: login
      security: []
      x-postman-event:
        - listen: test
          script:
            type: text/javascript
            exec:
              - "const response = pm.response.json();"
              - "if (response?.data?.token) {"
              - "  pm.environment.set('token', response.data.token);"
              - "}"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              username:
                value:
                  login: admin@example.com
                  password: password
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get authenticated user profile
      operationId: getAuthenticatedUser
      responses:
        "200":
          description: User profile retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke current access token
      operationId: logout
      responses:
        "200":
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a user
      description: Administrator-only endpoint.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
            examples:
              employee:
                value:
                  name: New Employee
                  username: newemployee
                  email: new@example.com
                  password: secure-password
                  role: employee
      responses:
        "201":
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterUserSuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/offices:
    get:
      tags:
        - Offices
      summary: List offices
      operationId: listOffices
      parameters:
        - name: active_only
          in: query
          required: false
          description: Return only active offices when true.
          schema:
            type: boolean
      responses:
        "200":
          description: Offices retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeCollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags:
        - Offices
      summary: Create office
      description: Administrator-only endpoint.
      operationId: createOffice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOfficeRequest"
            examples:
              office:
                value:
                  name: Kantor Baru
                  address: Jl. Merdeka No. 1
                  latitude: -2.965107
                  longitude: 104.736443
                  radius: 50
                  is_active: true
      responses:
        "201":
          description: Office created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/offices/{office}:
    parameters:
      - $ref: "#/components/parameters/OfficeId"
    get:
      tags:
        - Offices
      summary: Get office
      operationId: getOffice
      responses:
        "200":
          description: Office retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Offices
      summary: Update office
      description: Administrator-only endpoint. Partial updates are accepted by the current Laravel request rules.
      operationId: updateOffice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfficeRequest"
      responses:
        "200":
          description: Office updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags:
        - Offices
      summary: Partially update office
      description: Administrator-only endpoint.
      operationId: patchOffice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfficeRequest"
      responses:
        "200":
          description: Office updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Offices
      summary: Delete office
      description: Administrator-only endpoint. The model uses soft deletes.
      operationId: deleteOffice
      responses:
        "200":
          description: Office deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/attendances:
    get:
      tags:
        - Attendances
      summary: List attendances
      description: Administrators receive all attendances. Employees receive only their own attendances.
      operationId: listAttendances
      responses:
        "200":
          description: Attendances retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags:
        - Attendances
      summary: Create attendance
      description: Employees check in for themselves. Administrators must provide `user_id` and can create attendance for another user.
      operationId: createAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreAttendanceRequest"
            examples:
              employeeCheckIn:
                value:
                  office_id: 1
                  in_latitude: -2.965107
                  in_longitude: 104.736443
      responses:
        "201":
          description: Attendance created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/attendances/{attendance}:
    parameters:
      - $ref: "#/components/parameters/AttendanceId"
    get:
      tags:
        - Attendances
      summary: Get attendance
      description: Administrators can view any attendance. Employees can view only their own attendance.
      operationId: getAttendance
      responses:
        "200":
          description: Attendance retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Attendances
      summary: Update attendance
      description: Administrators can update any attendance. Employees can update only their own attendance.
      operationId: updateAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendanceRequest"
      responses:
        "200":
          description: Attendance updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags:
        - Attendances
      summary: Partially update attendance
      description: Administrators can update any attendance. Employees can update only their own attendance.
      operationId: patchAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendanceRequest"
      responses:
        "200":
          description: Attendance updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Attendances
      summary: Delete attendance
      description: Administrator-only endpoint. The model uses soft deletes.
      operationId: deleteAttendance
      responses:
        "200":
          description: Attendance deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: Use the Postman environment variable `{{token}}` as the bearer token value.
  parameters:
    OfficeId:
      name: office
      in: path
      required: true
      description: Office ID.
      schema:
        type: integer
        format: int64
    AttendanceId:
      name: attendance
      in: path
      required: true
      description: Attendance ID.
      schema:
        type: integer
        format: int64
  responses:
    Unauthenticated:
      description: Unauthenticated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
  schemas:
    StatusResponse:
      type: object
      required:
        - status
        - name
      properties:
        status:
          type: string
          example: ok
        name:
          type: string
          example: Agung Presence

    EmptySuccessResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        data:
          nullable: true

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Username or email address.
        password:
          type: string
          format: password

    RegisterUserRequest:
      type: object
      required:
        - name
        - username
        - email
        - password
        - role
      properties:
        name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
        role:
          $ref: "#/components/schemas/UserRole"

    StoreOfficeRequest:
      type: object
      required:
        - name
        - latitude
        - longitude
      properties:
        name:
          type: string
          maxLength: 100
        address:
          type:
            - string
            - "null"
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radius:
          type: integer
          minimum: 1
        photo:
          type:
            - string
            - "null"
        is_active:
          type: boolean

    UpdateOfficeRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        address:
          type:
            - string
            - "null"
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radius:
          type: integer
          minimum: 1
        photo:
          type:
            - string
            - "null"
        is_active:
          type: boolean

    StoreAttendanceRequest:
      type: object
      required:
        - office_id
        - in_latitude
        - in_longitude
      properties:
        user_id:
          type: integer
          format: int64
          description: Required for administrators. Ignored for employees.
        office_id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        in_at:
          type: string
          format: date-time
        in_latitude:
          type: number
          minimum: -90
          maximum: 90
        in_longitude:
          type: number
          minimum: -180
          maximum: 180
        proof_photo:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/AttendanceStatus"

    UpdateAttendanceRequest:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: Administrator-only field.
        office_id:
          type: integer
          format: int64
          description: Administrator-only field.
        date:
          type: string
          format: date
          description: Administrator-only field.
        in_at:
          type: string
          format: date-time
          description: Administrator-only field.
        out_at:
          type: string
          format: date-time
        in_latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Administrator-only field.
        in_longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Administrator-only field.
        proof_photo:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/AttendanceStatus"

    UserRole:
      type: string
      enum:
        - administrator
        - employee

    AttendanceStatus:
      type: string
      enum:
        - on_time
        - late
        - absent
        - sick
        - leave

    User:
      type: object
      required:
        - id
        - name
        - username
        - email
        - role
        - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type:
            - string
            - "null"
          format: date-time

    Office:
      type: object
      required:
        - id
        - name
        - latitude
        - longitude
        - radius
        - is_active
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type:
            - string
            - "null"
        latitude:
          type: number
        longitude:
          type: number
        radius:
          type: integer
        photo:
          type:
            - string
            - "null"
        is_active:
          type: boolean
        created_by:
          type:
            - string
            - "null"
        updated_by:
          type:
            - string
            - "null"
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time

    Attendance:
      type: object
      required:
        - id
        - user_id
        - office_id
        - in_latitude
        - in_longitude
        - status
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        office_id:
          type: integer
          format: int64
        date:
          type:
            - string
            - "null"
          format: date
        in_at:
          type:
            - string
            - "null"
          format: date-time
        out_at:
          type:
            - string
            - "null"
          format: date-time
        in_latitude:
          type: number
        in_longitude:
          type: number
        proof_photo:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        created_by:
          type:
            - string
            - "null"
        updated_by:
          type:
            - string
            - "null"
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        office:
          oneOf:
            - $ref: "#/components/schemas/Office"
            - type: "null"

    UserResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
        data:
          $ref: "#/components/schemas/User"

    LoginSuccessResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Login successful.
        data:
          type: object
          required:
            - user
            - token
          properties:
            user:
              $ref: "#/components/schemas/User"
            token:
              type: string

    RegisterUserSuccessResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: User registered successfully.
        data:
          type: object
          required:
            - user
          properties:
            user:
              $ref: "#/components/schemas/User"

    OfficeResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
        data:
          $ref: "#/components/schemas/Office"

    OfficeCollectionResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Office"

    AttendanceResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
        data:
          $ref: "#/components/schemas/Attendance"

    AttendanceCollectionResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Attendance"
security:
  - sanctum: []
