services:
  - type: web
    name: agung-presence-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/al-dioooo/api-agung-presence.git
    branch: development
    autoDeploy: true
    healthCheckPath: /api/status
    envVars:
      - key: APP_NAME
        value: AgungPresence
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: agung-presence-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: "true"
      - key: MAIL_MAILER
        value: log

databases:
  - name: agung-presence-db
    plan: free
    region: singapore
    databaseName: api_agung_presence
    user: agung_presence
    postgresMajorVersion: "17"
