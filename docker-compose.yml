services:
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: AgungPresence
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:Ruy7adGoTzPbAxA+VjJavxUwLhsHWeuZ7Y1JRV+CE2c=}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: api_agung_presence
      DB_USERNAME: agung_presence
      DB_PASSWORD: agung_presence
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: api_agung_presence
      POSTGRES_USER: agung_presence
      POSTGRES_PASSWORD: agung_presence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agung_presence -d api_agung_presence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
